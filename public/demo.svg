<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" fill="none">
  <style>
    .t { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 13px; }
    .sm { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; }
    .dim { fill: #8b9286 }
    .wh { fill: #e8ebe4 }
    .gr { fill: #22a559 }
    .rd { fill: #c0392b }
    .yl { fill: #b68d1a }
    .ac { fill: #d7fa87 }
    .bd { font-weight: 700 }
  </style>

  <!-- Terminal chrome -->
  <rect width="840" height="520" rx="12" fill="#1a1e1c"/>
  <rect width="840" height="38" rx="12" fill="#252a27"/>
  <rect y="26" width="840" height="12" fill="#252a27"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>
  <text x="420" y="23" text-anchor="middle" class="sm dim">rulemap — Terminal</text>

  <!-- Prompt -->
  <text x="24" y="68" class="t ac">~/my-project</text>
  <text x="130" y="68" class="t dim">$</text>
  <text x="144" y="68" class="t wh">npx rulemap inspect . --file src/auth.ts</text>

  <!-- Header -->
  <text x="24" y="100" class="t ac bd">Rulemap · Codex</text>
  <text x="24" y="118" class="sm dim">File: src/auth.ts | Launch directory: src</text>
  <text x="24" y="134" class="sm dim">Expected applicability · profile 2026-10-17</text>

  <!-- Rule 1: INCLUDED AGENTS.md -->
  <rect x="24" y="150" width="790" height="50" rx="6" fill="#1e2e24" stroke="#22a559" stroke-width="1" opacity="0.7"/>
  <text x="40" y="170" class="t gr bd">INCLUDED</text>
  <text x="130" y="170" class="t dim">·</text>
  <text x="142" y="170" class="t wh bd">AGENTS.md</text>
  <text x="250" y="170" class="t dim">:1-3</text>
  <text x="40" y="189" class="sm dim">First non-empty candidate in the root-to-launch-directory chain.</text>

  <!-- Rule 2: EXCLUDED docs/AGENTS.md -->
  <rect x="24" y="210" width="790" height="50" rx="6" fill="#2a1f1f" stroke="#c0392b" stroke-width="1" opacity="0.5"/>
  <text x="40" y="230" class="t rd bd">EXCLUDED</text>
  <text x="131" y="230" class="t dim">·</text>
  <text x="142" y="230" class="t wh bd">docs/AGENTS.md</text>
  <text x="305" y="230" class="t dim">:1-2</text>
  <text x="40" y="249" class="sm dim">Outside the launch directory ancestry (src); target file does not change discovery.</text>

  <!-- Rule 3: EXCLUDED src/AGENTS.md -->
  <rect x="24" y="270" width="790" height="50" rx="6" fill="#2a1f1f" stroke="#c0392b" stroke-width="1" opacity="0.5"/>
  <text x="40" y="290" class="t rd bd">EXCLUDED</text>
  <text x="131" y="290" class="t dim">·</text>
  <text x="142" y="290" class="t wh bd">src/AGENTS.md</text>
  <text x="295" y="290" class="t dim">:1-4</text>
  <text x="40" y="309" class="sm dim">src/AGENTS.override.md takes precedence; Codex selects one file per directory.</text>

  <!-- Rule 4: INCLUDED src/AGENTS.override.md -->
  <rect x="24" y="330" width="790" height="50" rx="6" fill="#1e2e24" stroke="#22a559" stroke-width="1" opacity="0.7"/>
  <text x="40" y="350" class="t gr bd">INCLUDED</text>
  <text x="130" y="350" class="t dim">·</text>
  <text x="142" y="350" class="t wh bd">src/AGENTS.override.md</text>
  <text x="398" y="350" class="t dim">:1-3</text>
  <text x="40" y="369" class="sm dim">Override selected in the root-to-launch-directory chain.</text>

  <!-- Divider -->
  <line x1="24" y1="396" x2="814" y2="396" stroke="#333" stroke-width="1"/>

  <!-- Summary -->
  <text x="24" y="420" class="t gr bd">2 included</text>
  <text x="120" y="420" class="t dim">·</text>
  <text x="135" y="420" class="t rd bd">2 excluded</text>
  <text x="235" y="420" class="t dim">·</text>
  <text x="250" y="420" class="t yl bd">0 conditional</text>
  <text x="380" y="420" class="t dim">· 482 bytes loaded</text>

  <!-- Hint -->
  <text x="24" y="448" class="sm dim">Add --web to open the interactive viewer with live editing and agent comparison.</text>

  <!-- Second prompt -->
  <text x="24" y="482" class="t ac">~/my-project</text>
  <text x="130" y="482" class="t dim">$</text>
  <text x="144" y="482" class="t wh">npx rulemap compare . --file src/auth.ts --profiles codex,claude</text>

  <!-- Compare result hint -->
  <text x="24" y="504" class="sm dim">Same repository. Codex sees 2 rules. Claude Code sees 5. One agent misses your security policy.</text>
</svg>
