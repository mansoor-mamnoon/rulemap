<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1280" height="640" fill="#1a1e1c"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252a27" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Logo -->
  <g transform="translate(540, 100)">
    <rect width="80" height="80" rx="20" fill="#203c2d"/>
    <path d="M20 20h18v18h-18zm22 22h18v18h-18z" fill="#d7fa87"/>
    <path d="M29 38v13H42M38 29h13V42" fill="none" stroke="#d7fa87" stroke-width="4"/>
  </g>

  <!-- Title -->
  <text x="640" y="240" text-anchor="middle" class="t" fill="#e8ebe4" font-size="64" font-weight="700">Rulemap</text>

  <!-- Tagline -->
  <text x="640" y="300" text-anchor="middle" class="t" fill="#8b9286" font-size="26">Your coding agent has rules.</text>
  <text x="640" y="340" text-anchor="middle" class="t" fill="#d7fa87" font-size="26" font-weight="600">Do you know which ones actually apply?</text>

  <!-- Agent badges -->
  <g transform="translate(340, 400)">
    <rect width="120" height="36" rx="18" fill="#203c2d"/>
    <text x="60" y="24" text-anchor="middle" class="mono" fill="#d7fa87" font-size="14" font-weight="600">Codex</text>
  </g>
  <g transform="translate(480, 400)">
    <rect width="150" height="36" rx="18" fill="#203c2d"/>
    <text x="75" y="24" text-anchor="middle" class="mono" fill="#d7fa87" font-size="14" font-weight="600">Claude Code</text>
  </g>
  <g transform="translate(650, 400)">
    <rect width="120" height="36" rx="18" fill="#203c2d"/>
    <text x="60" y="24" text-anchor="middle" class="mono" fill="#d7fa87" font-size="14" font-weight="600">Cursor</text>
  </g>
  <g transform="translate(790, 400)">
    <rect width="120" height="36" rx="18" fill="#203c2d"/>
    <text x="60" y="24" text-anchor="middle" class="mono" fill="#d7fa87" font-size="14" font-weight="600">Copilot</text>
  </g>

  <!-- Subtitle -->
  <text x="640" y="490" text-anchor="middle" class="t" fill="#5a6158" font-size="18">Local visual debugger for agent instruction files</text>

  <!-- Command preview -->
  <rect x="340" y="520" width="600" height="44" rx="8" fill="#252a27"/>
  <text x="360" y="548" class="mono" fill="#8b9286" font-size="15">$</text>
  <text x="380" y="548" class="mono" fill="#e8ebe4" font-size="15">npx rulemap inspect . --file src/auth.ts --web</text>
</svg>
